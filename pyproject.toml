[project]
name = "enterprise-dms-backend"
version = "0.1.0"
description = "Enterprise Document Management System - API and workers"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.32",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9",
  "prometheus-client>=0.20",
  "pypdf>=6.19.0",
  "pillow>=12.3.0",
  "ldap3>=2.9.1",
  "defusedxml>=0.7.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "pgserver>=0.1.4",
  "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["B008", "S101", "E501", "SIM105", "SIM102", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: needs a real PostgreSQL (provided by pgserver or TEST_DATABASE_URL)",
  "security: security / authorization negative tests",
]

[tool.mypy]
python_version = "3.12"
platform = "linux"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
exclude = ["migrations/"]
