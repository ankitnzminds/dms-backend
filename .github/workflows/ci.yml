name: backend-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {version: "0.11.16"}
      - run: uv sync --frozen --python 3.12
      - name: Lint
        run: uv run ruff check app tests scripts
      - name: Format check
        run: uv run ruff format --check app tests scripts
      - name: Type check
        run: uv run mypy app
      - name: OpenAPI contract is up to date
        env:
          AUTH_PROVIDER: local
          LOCAL_JWT_SECRET: ci-only-local-jwt-secret-0123456789abcdef
          DATABASE_URL: postgresql://x:y@localhost/z
        run: |
          uv run python -m app.cli export-openapi -o /tmp/openapi.json
          diff -u docs/api/openapi.json /tmp/openapi.json

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: dms, POSTGRES_PASSWORD: ci-password, POSTGRES_DB: dms_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dms -d dms_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://dms:ci-password@localhost:5432/dms_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {version: "0.11.16"}
      - run: uv sync --frozen --python 3.12
      - name: Tests (unit, integration, authorization, security) incl. migrations from a clean DB
        run: uv run pytest --cov=app --cov-report=term --cov-fail-under=80
      - name: Models and migrations agree
        env:
          DATABASE_URL: postgresql://dms:ci-password@localhost:5432/dms_test
        run: uv run python -m app.cli check-migrations

  security-scans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@v5
        with: {version: "0.11.16"}
      - name: Dependency vulnerabilities
        run: |
          uv sync --frozen --python 3.12
          uv export --frozen --no-dev --no-hashes --no-emit-project -o /tmp/requirements.txt
          uv run pip-audit -r /tmp/requirements.txt --no-deps --disable-pip --strict
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Static security rules (ruff S)
        run: uv run ruff check app --select S

  image:
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: enterprise-dms-backend:ci
      - name: Container scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: enterprise-dms-backend:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
